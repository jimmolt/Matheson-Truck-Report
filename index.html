<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matheson Truck Report</title>
<meta name="theme-color" content="#262e36">
<meta name="apple-mobile-web-app-title" content="Truck Report">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: gas tiles in a grid, size choices open under the tiles, order and send button pinned at the bottom. */
:root{
  --bg:#eef0f2; --panel:#ffffff; --fg:#1b2127; --muted:#5d6872; --line:#d3d9de;
  --accent:#c4520b; --accent-fg:#ffffff; --sel:#fbeadc;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181c; --panel:#1e242a; --fg:#e8ecef; --muted:#9aa5ae; --line:#323b43;
    --accent:#f08a43; --accent-fg:#1a1006; --sel:#3a2819; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14181c; --panel:#1e242a; --fg:#e8ecef; --muted:#9aa5ae; --line:#323b43;
  --accent:#f08a43; --accent-fg:#1a1006; --sel:#3a2819; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--body);
  padding-block:16px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:700 30px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 14px;min-height:48px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-size:18px}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px}
input[type=text],input[type=tel],textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:10px 12px;min-height:44px}
label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.tile{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:132px}
.tile svg{width:44px;height:84px}
.tile .nm{font:700 20px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.tile[aria-expanded="true"]{border-color:var(--accent);background:var(--sel)}
.badge{position:absolute;top:6px;right:6px;min-width:26px;height:26px;border-radius:13px;background:var(--accent);color:var(--accent-fg);font-weight:700;display:grid;place-items:center;padding:0 7px;font-size:14px}

.sizes{background:var(--panel);border:2px solid var(--accent);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sizes .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sizes h2{font:700 22px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.opt{position:relative;border:1px solid var(--line);background:var(--bg);border-radius:8px;min-height:52px;font:700 20px var(--display);letter-spacing:.02em}
.opt .b{position:absolute;top:-8px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--accent-fg);font:700 13px var(--body);display:grid;place-items:center;padding:0 6px}
.hint{font-size:13px;color:var(--muted);margin:0}
.editbox{display:flex;flex-direction:column;gap:6px}

.order{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.order .ttl{font:700 14px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.line{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-bottom:1px solid var(--line);min-height:52px}
.line:last-child{border-bottom:0}
.line .t{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:40px;height:40px;border:1px solid var(--line);background:var(--panel);border-radius:6px;font-size:20px;font-weight:600}
.stepper output{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.empty{padding:16px 14px;color:var(--muted)}
.send{position:sticky;bottom:0;display:flex;flex-direction:column;gap:8px;background:var(--bg);padding-block:8px}
.send a{display:grid;place-items:center;text-decoration:none;text-align:center}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1}
.status{font-size:13px;color:var(--muted);min-height:18px}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px}
summary{padding:12px 14px;font-weight:600;cursor:pointer;min-height:44px;display:flex;align-items:center}
details .in{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
[hidden]{display:none!important}
body{margin:0}
</style>
</head>
<body>

<div class="wrap">
  <h1>Matheson Truck Report</h1>

  <div class="tiles" id="tiles"></div>
  <div id="sizePanel" hidden></div>

  <div class="order">
    <div class="ttl"><span>Please bring us</span></div>
    <div id="orderList"></div>
  </div>

  <details id="setup">
    <summary>Phone number (optional)</summary>
    <div class="in">
      <div><label for="sPhone">Phone number (optional)</label><input type="tel" id="sPhone" inputmode="tel" placeholder="402-555-0123"></div>
    </div>
  </details>

  <div class="send">
    <div class="status" id="status" role="status"></div>
    <a class="btn primary" id="smsLink" href="#">Open in Messages</a>
    <div class="row2"><button class="btn" id="copyBtn" type="button">Copy text</button><button class="btn" id="clearBtn" type="button">Clear all</button></div>
  </div>
</div>

    {id:'ACE',name:'Acetylene',label:'Acetylene',color:'#a52a2a',sizes:['WS','WQ','B','MC']},
    {id:'N2',name:'Nitrogen',label:'Nitrogen',color:'#4a4f55',sizes:['T','K','S','Q']},
    {id:'AR',name:'Argon',label:'Argon',color:'#1c8f9a',sizes:['T','K','S','Q']},
    {id:'CO2',name:'CO2',label:'CO2',color:'#7a838c',sizes:['50 lb','25 lb']}
  ];
  var S={name:'',phone:'',order:{},sizes:{}};
  try{ var r=localStorage.getItem(KEY); if(r){ var p=JSON.parse(r); S.name=p.name||''; S.phone=p.phone||''; S.order=p.order||{}; S.sizes=p.sizes||{}; } }catch(e){}
  GASES.forEach(function(g){ if(S.sizes[g.id]&&S.sizes[g.id].length) g.sizes=S.sizes[g.id]; });
  function save(){ var o={name:S.name,phone:S.phone,order:S.order,sizes:{}}; GASES.forEach(function(g){o.sizes[g.id]=g.sizes;}); try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){} }
  function $(id){return document.getElementById(id);}
  var open=null, editSizes=false;

  function icon(color){
    return '<svg viewBox="0 0 44 84" aria-hidden="true">'+
      '<rect x="17" y="2" width="10" height="7" rx="2" fill="#8a9299"/>'+
      '<rect x="14" y="8" width="16" height="6" rx="2" fill="#6f777e"/>'+
      '<path d="M8 28 Q8 14 22 14 Q36 14 36 28 L36 78 Q36 82 32 82 L12 82 Q8 82 8 78 Z" fill="'+color+'"/>'+
      '<path d="M8 28 Q8 14 22 14 Q36 14 36 28 Z" fill="#fff" opacity=".18"/>'+
      '<rect x="8" y="46" width="28" height="3" fill="#fff" opacity=".35"/>'+
      '</svg>';
  }
  function total(id){ var n=0; Object.keys(S.order).forEach(function(k){ if(k.indexOf(id+'|')===0) n+=S.order[k]; }); return n; }
  function gas(id){ return GASES.filter(function(g){return g.id===id;})[0]; }

  function renderTiles(){
    var t=$('tiles'); t.innerHTML='';
    GASES.forEach(function(g){
      var b=document.createElement('button'); b.type='button'; b.className='tile';
      b.setAttribute('aria-expanded',open===g.id?'true':'false');
      b.innerHTML=icon(g.color)+'<span class="nm"></span>';
      b.querySelector('.nm').textContent=g.name;
      var n=total(g.id);
      if(n){ var bd=document.createElement('span'); bd.className='badge'; bd.textContent=n; b.appendChild(bd); }
      b.onclick=function(){ open=(open===g.id)?null:g.id; editSizes=false; render(); if(open) $('sizePanel').scrollIntoView({block:'nearest',behavior:'smooth'}); };
      t.appendChild(b);
    });
  }

  function renderSizes(){
    var p=$('sizePanel');
    if(!open){ p.hidden=true; p.innerHTML=''; return; }
    var g=gas(open); p.hidden=false; p.className='sizes'; p.innerHTML='';
    var hd=document.createElement('div'); hd.className='hd';
    hd.innerHTML='<h2></h2><button class="btn small" type="button">Done</button>';
    hd.querySelector('h2').textContent=g.label+' size?';
    hd.querySelector('button').onclick=function(){ open=null; render(); };
    p.appendChild(hd);
    var o=document.createElement('div'); o.className='opts';
    g.sizes.forEach(function(sz){
      var b=document.createElement('button'); b.type='button'; b.className='opt'; b.textContent=sz;
      var k=g.id+'|'+sz, n=S.order[k]||0;
      if(n){ var bb=document.createElement('span'); bb.className='b'; bb.textContent=n; b.appendChild(bb); }
      b.onclick=function(){ S.order[k]=(S.order[k]||0)+1; save(); render(); };
      o.appendChild(b);
    });
    p.appendChild(o);
    var h=document.createElement('p'); h.className='hint'; h.textContent='Tap a size once for each cylinder. Change counts in the list below.'; p.appendChild(h);
    var eb=document.createElement('div'); eb.className='editbox';
    if(!editSizes){
      var e=document.createElement('button'); e.type='button'; e.className='btn small'; e.textContent='Edit these sizes'; e.style.alignSelf='flex-start';
      e.onclick=function(){ editSizes=true; renderSizes(); };
      eb.appendChild(e);
    } else {
      var lb=document.createElement('label'); lb.setAttribute('for','sizeEdit'); lb.textContent='Sizes, separated by commas';
      var ta=document.createElement('input'); ta.type='text'; ta.id='sizeEdit'; ta.value=g.sizes.join(', ');
      var sv=document.createElement('button'); sv.type='button'; sv.className='btn small'; sv.textContent='Save sizes'; sv.style.alignSelf='flex-start';
      sv.onclick=function(){
        var arr=ta.value.split(',').map(function(s){return s.trim();}).filter(Boolean);
        if(arr.length){ g.sizes=arr; save(); }
        editSizes=false; render();
      };
      eb.appendChild(lb); eb.appendChild(ta); eb.appendChild(sv);
    }
    p.appendChild(eb);
  }

  function lines(){
    var out=[];
    GASES.forEach(function(g){
      Object.keys(S.order).forEach(function(k){
        if(k.indexOf(g.id+'|')!==0) return;
        var sz=k.slice(g.id.length+1), n=S.order[k]; if(!n) return;
        out.push({key:k,n:n,text:g.name+' '+sz});
      });
    });
    return out;
  }
  function message(){
    var L=lines(); if(!L.length) return '';
    return 'Please bring us:\n\n'+L.map(function(l){return '- '+l.n+' x '+l.text;}).join('\n')+'\n\nThanks\nJim Molt';
  }

  function renderOrder(){
    var box=$('orderList'); box.innerHTML='';
    var L=lines();
    if(!L.length){ box.innerHTML='<div class="empty">Tap a gas above, then pick a size.</div>'; return; }
    L.forEach(function(l){
      var row=document.createElement('div'); row.className='line';
      row.innerHTML='<span class="t"></span><div class="stepper"><button type="button" aria-label="Fewer">−</button><output></output><button type="button" aria-label="More">+</button></div>';
      row.querySelector('.t').textContent=l.text;
      row.querySelector('output').textContent=l.n;
      var bs=row.querySelectorAll('button');
      bs[0].onclick=function(){ var v=(S.order[l.key]||1)-1; if(v<1) delete S.order[l.key]; else S.order[l.key]=v; save(); render(); };
      bs[1].onclick=function(){ S.order[l.key]=(S.order[l.key]||0)+1; save(); render(); };
      box.appendChild(row);
    });
  }

  function renderSend(){
    var m=message(), ph=(S.phone||'').replace(/[^\d+]/g,'');
    var a=$('smsLink'); a.href='sms:'+ph+'?&body='+encodeURIComponent(m);
    a.style.opacity=m?1:.5; $('copyBtn').style.opacity=m?1:.5;
  }
  function render(){ renderTiles(); renderSizes(); renderOrder(); renderSend(); }

  function flash(t){ var s=$('status'); s.textContent=t; setTimeout(function(){ if(s.textContent===t) s.textContent=''; },4000); }
  $('smsLink').onclick=function(e){
    if(!message()){ e.preventDefault(); flash('Pick at least one cylinder first.'); return; }
  };
  $('copyBtn').onclick=function(){
    var m=message(); if(!m){ flash('Pick at least one cylinder first.'); return; }
    try{ navigator.clipboard.writeText(m).then(function(){ flash('Copied. Paste it into Messages.'); },function(){ flash('Copy was blocked here.'); }); }
    catch(e){ flash('Copy was blocked here.'); }
  };
  $('clearBtn').onclick=function(){ S.order={}; save(); render(); };
  $('sPhone').value=S.phone;
  $('sPhone').addEventListener('input',function(){ S.phone=this.value; save(); renderSend(); });
  render();
})();
</script>

</body>
</html>
